group = "com.et_plate_reader"
version = "1.0-SNAPSHOT"

// Host Flutter app supplies AGP and the Kotlin Gradle plugin. AGP 9
// compiles Kotlin itself (unless the host sets android.builtInKotlin=false);
// older AGP (8.x hosts) needs the Kotlin plugin applied here, or the plugin's
// Kotlin sources are silently left out of the build.
apply plugin: "com.android.library"
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def applyKotlin = agpMajor < 9 ||
        project.findProperty("android.builtInKotlin")?.toString() == "false"
if (applyKotlin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.et_plate_reader"
    // Keep modest so hosts on Flutter 3.24-era SDKs can compile.
    compileSdk = 35

    defaultConfig {
        minSdk = 24
        // Keeps ML Kit's text recognizer in host apps' minified release builds.
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (applyKotlin) {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.1.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

    def camerax = "1.4.1"
    implementation("androidx.camera:camera-core:$camerax")
    implementation("androidx.camera:camera-camera2:$camerax")
    implementation("androidx.camera:camera-lifecycle:$camerax")
    implementation("androidx.camera:camera-view:$camerax")

    // Latin OCR (prototype recogniser — see doc/MODEL_DECISION.md).
    implementation("com.google.mlkit:text-recognition:16.0.1")
}
